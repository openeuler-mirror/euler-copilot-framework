# 修复模式：仅对暂存区文件生效；存量仓库请勿运行 pre-commit run --all-files
minimum_pre_commit_version: "4.0"

repos:
  # ===== 通用基础 hook（所有语言） =====
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace          # 修复：移除行尾空白
        exclude: ^(pnpm-lock\.yaml|package-lock\.json|.*\.lock)$
      - id: end-of-file-fixer            # 修复：确保文件以单个换行结尾
        exclude: ^(pnpm-lock\.yaml|package-lock\.json|.*\.lock)$
      - id: check-yaml
        # Helm chart 模板含 Go template 语法，标准 YAML 解析器无法解析，精确排除（属模板误报）
        exclude: ^deploy/chart/
      - id: check-json
      - id: check-xml
      - id: check-merge-conflict
      - id: check-added-large-files
        # 存量最大文件约 1.7MB（文档图片/资产），按存量基线放宽到 2MB
        args: [--maxkb=2048]
      - id: detect-private-key

  # ===== 密钥检测 =====
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ===== 拼写检查 =====
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: ^(assets/tiktoken/|documents/.*/pictures/)

  # ===== Python：Ruff（修复）+ Bandit（检查） =====
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]                  # 修复模式；只读档去掉 --fix
      - id: ruff-format                # 修复模式；只读档加 --check
  - repo: https://gitcode.com/gh_mirrors/ba/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        # pyproject.toml 存在：读取 [tool.bandit]；存量仓库先只看高危，清理后放开 -ll → 全量
        args: [-c, pyproject.toml, -lll]
        additional_dependencies: ["bandit[toml]"]

  # ===== Shell：Shfmt（修复）+ ShellCheck（检查） =====
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        # 修复模式无需加参数（manifest 已内置 --write）；只读档加 args: [--check]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=error]      # 存量默认 error 起步；清理 PR 后按基线收紧回 warning

  # ===== Markdown：markdownlint（修复） =====
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [--fix]                  # 修复模式；只读档去掉 --fix
