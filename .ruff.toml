line-length = 120
indent-width = 4
target-version = "py311"

[lint]
# 存量仓库先只开错误类规则（E/F/I）；清理 PR 后按阶段收紧：B → UP/SIM → RUF → ALL
select = ["E", "F", "I"]
ignore = [
    "E501",
    "ANN401",
    "ARG002",
    "D400",
    "D415",
    "PYI019",
    "RUF001",
    "RUF002",
    "RUF003",
    "S104",
    "TD002",
    "TD003",
    "INP001",
    "D203",
    "D212",
    "S101"
]

[format]
quote-style = "double"
